name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Tests never read a developer .env; conftest supplies safe test settings.
      LEAD_AGENT_DISABLE_ENV_FILE: "1"
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend
      - name: Unit, service and migration tests
        run: python -m pytest backend/tests -q
      - name: Migrate a fresh database to head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lead_agent_ci
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c = await asyncpg.connect("postgresql://postgres:postgres@localhost:5432/postgres")
              await c.execute("CREATE DATABASE lead_agent_ci")
              await c.close()
              c = await asyncpg.connect("postgresql://postgres:postgres@localhost:5432/lead_agent_ci")
              await c.execute("CREATE TABLE alembic_version (version_num VARCHAR(128) PRIMARY KEY)")
              await c.close()
          asyncio.run(main())
          PY
          python -m alembic -c backend/alembic.ini upgrade head
      - name: PostgreSQL integration tests
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lead_agent_ci
        run: python -m pytest backend/tests -m postgres_integration -q

  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm packages (high and critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
